<!doctype html>
<meta charset="utf-8">
<title>SLAM 3D - poses and camera frustums</title>
<style>
  html,body{margin:0;height:100%;background:#11161c;color:#dfe6ee;
    font:13px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
  #wrap{display:flex;height:100%}
  #left{flex:1;display:flex;flex-direction:column;min-width:0}
  #cv{flex:1;cursor:grab;min-height:0}
  #cv.drag{cursor:grabbing}
  #bar{background:#161d26;border-top:1px solid #26303c;padding:8px 14px;
    display:flex;align-items:center;gap:10px;font-size:12px}
  #bar input[type=range]{flex:1;min-width:70px}
  #play{background:#212b36;color:#dfe6ee;border:1px solid #2f3b48;border-radius:4px;
    padding:3px 12px;cursor:pointer;font-size:12px}
  #play:hover{background:#2a3644}
  #panel{width:252px;background:#161d26;border-left:1px solid #26303c;
    padding:14px;overflow:auto;box-sizing:border-box}
  h1{font-size:14px;margin:0 0 4px}
  .sub{color:#8b9aab;font-size:11px;margin-bottom:12px}
  .row{display:flex;align-items:center;gap:7px;margin:6px 0}
  .row input[type=range]{flex:1}
  label{user-select:none}
  .stat{display:flex;justify-content:space-between;padding:2px 0;
    border-bottom:1px dotted #26303c;font-size:12px}
  .stat b{font-weight:600;color:#fff}
  .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
  .hint{color:#7d8b9c;font-size:11px;margin-top:10px;line-height:1.6}
  #now{font-variant-numeric:tabular-nums;min-width:88px}
  .camlist{font-size:11px;color:#9fb0c2;margin-top:8px;line-height:1.7}
</style>
<div id="wrap">
  <div id="left">
    <canvas id="cv"></canvas>
    <div id="bar">
      <button id="play">&#9654;</button>
      <span id="now">t = 0.00 s</span>
      <input type="range" id="tl" min="0" max="0" value="0" step="1">
      <span id="tot" style="color:#8b9aab"></span>
      <span style="color:#7d8b9c;margin-left:6px">视锥长度</span>
      <input type="range" id="fr" min="1" max="16" value="5" step="0.5" style="width:80px">
      <span id="frv" style="color:#8b9aab;min-width:42px">5.0 m</span>
    </div>
  </div>
  <div id="panel">
    <h1>SLAM 3D &middot; 位姿与视场</h1>
    <div class="sub">拖动旋转 &middot; 滚轮缩放 &middot; shift+拖动 平移</div>
    <div id="stats"></div>
    <div style="margin-top:12px">
      <div class="row"><label><input type="checkbox" id="cPts" checked> 地图点云</label></div>
      <div class="row"><label><input type="checkbox" id="cTraj" checked> 轨迹</label></div>
      <div class="row"><label><input type="checkbox" id="cArrow" checked> 当前时刻方向箭头</label></div>
      <div class="row"><label><input type="checkbox" id="cFru" checked> 四路相机视锥</label></div>
      <div class="row"><label><input type="checkbox" id="cBoards" checked> 靶标板</label></div>
      <div class="row"><label><input type="checkbox" id="cTags"> 地板标签</label></div>
      <div class="row"><label><input type="checkbox" id="cCyl" checked> 目标圆柱</label></div>
      <div class="row"><label><input type="checkbox" id="cGrid" checked> 池底网格</label></div>
      <div class="row"><label><input type="checkbox" id="cSpin"> 自动旋转</label></div>
      <div class="row" style="margin-top:10px">配色
        <select id="cMode" style="flex:1;background:#212b36;color:#dfe6ee;
          border:1px solid #2f3b48;border-radius:4px;padding:2px">
          <option value="cls">按表面</option>
          <option value="z">按高度</option>
        </select>
      </div>
      <div class="row">点大小 <input type="range" id="rSize" min="1" max="6" value="2"></div>
    </div>
    <div class="camlist" id="cams"></div>
    <div class="hint">
      <span class="sw" style="background:#ffb347"></span>地板 &nbsp;
      <span class="sw" style="background:#6fb3ff"></span>池壁<br>
      <span class="sw" style="background:#ff5c5c"></span>目标 &nbsp;
      <span class="sw" style="background:#b9c4d0"></span>其他<br><br>
      网格 2 m；池底 z = −10.84 m。<br>
      视锥按 ROS 光轴(+z) 与内参 fx≈426.7 绘制：
      HFOV 73.7° &middot; VFOV 58.7°。
    </div>
  </div>
</div>

<script>
const D = JSON.parse(document.getElementById('DATA').textContent);
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');

let az = -0.9, el = 0.42, dist = 30, panX = 0, panY = 0;
let target = [0, -20, -8];
let sel = 0, playing = false;
const pts = D.pts.map((p,i)=>({x:p[0],y:p[1],z:p[2],c:D.cls[i]}));
const S = D.samples;
const CAMCOL = {front:'#39d98a', right:'#5bb8ff', bottom:'#ffd166', rear:'#c792ff'};

document.getElementById('stats').innerHTML =
  `<div class="stat"><span>地图点</span><b>${D.pts.length}</b></div>` +
  `<div class="stat"><span>带姿态的位姿</span><b>${S.length}</b></div>` +
  `<div class="stat"><span>HFOV / VFOV</span><b>${D.hfov.toFixed(1)}° / ${D.vfov.toFixed(1)}°</b></div>`;

const tl = document.getElementById('tl');
tl.max = Math.max(0, S.length-1); tl.value = 0;
if (S.length) document.getElementById('tot').textContent =
  '/ ' + S[S.length-1].t.toFixed(2) + ' s（' + S.length + ' 帧）';

function fmt(i){
  if (!S.length) return;
  const s = S[i];
  document.getElementById('now').textContent = 't = ' + s.t.toFixed(2) + ' s';
  document.getElementById('cams').innerHTML = s.cams.map(c=>{
    const v = (s.vis && s.vis[c.n]) || [];
    const seen = v.length ? v.map(i=>'#'+i).join(' ') : '—';
    return `<div><span class="sw" style="background:${CAMCOL[c.n]}"></span>${c.n}` +
           `&nbsp; 看到 ${seen}</div>`;
  }).join('') + `<div style="margin-top:4px;color:#7d8b9c">` +
    `该时刻共可见 ${new Set(Object.values(s.vis||{}).flat()).size} 块板</div>`;
}
tl.addEventListener('input',()=>{ sel = +tl.value; fmt(sel); });
document.getElementById('play').addEventListener('click',e=>{
  playing = !playing;
  e.target.innerHTML = playing ? '&#10074;&#10074;' : '&#9654;';
});
const fr = document.getElementById('fr');
fr.addEventListener('input',()=>{
  document.getElementById('frv').textContent = (+fr.value).toFixed(1)+' m';
});

function resize(){
  const r = window.devicePixelRatio||1;
  cv.width = cv.clientWidth*r; cv.height = cv.clientHeight*r;
  ctx.setTransform(r,0,0,r,0,0);
}
window.addEventListener('resize', resize); resize();

let drag=null;
cv.addEventListener('mousedown',e=>{
  drag={x:e.clientX,y:e.clientY,az,el,px:panX,py:panY,sh:e.shiftKey};
  cv.classList.add('drag');
});
window.addEventListener('mouseup',()=>{drag=null;cv.classList.remove('drag');});
window.addEventListener('mousemove',e=>{
  if(!drag) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(drag.sh){ panX=drag.px+dx*dist*0.0016; panY=drag.py-dy*dist*0.0016; }
  else { az=drag.az-dx*0.006; el=Math.max(-1.5,Math.min(1.5,drag.el+dy*0.006)); }
});
cv.addEventListener('wheel',e=>{ e.preventDefault();
  dist=Math.max(2,Math.min(160,dist*(1+Math.sign(e.deltaY)*0.10)));
},{passive:false});

// orbit camera: eye circles the target, el > 0 places it ABOVE looking down
function project(){
  const ce=Math.cos(el), se=Math.sin(el), ca=Math.cos(az), sa=Math.sin(az);
  const w=cv.clientWidth, h=cv.clientHeight, fs=0.9*Math.min(w,h);
  const eye=[target[0]+dist*ce*ca, target[1]+dist*ce*sa, target[2]+dist*se];
  let f=[target[0]-eye[0], target[1]-eye[1], target[2]-eye[2]];
  const fl=Math.hypot(f[0],f[1],f[2])||1; f=[f[0]/fl,f[1]/fl,f[2]/fl];
  let r=[f[1], -f[0], 0];
  const rl=Math.hypot(r[0],r[1])||1; r=[r[0]/rl, r[1]/rl, 0];
  const u=[r[1]*f[2]-r[2]*f[1], r[2]*f[0]-r[0]*f[2], r[0]*f[1]-r[1]*f[0]];
  return function(x,y,z){
    const dx=x-eye[0], dy=y-eye[1], dz=z-eye[2];
    const zc = dx*f[0]+dy*f[1]+dz*f[2];
    const xc = dx*r[0]+dy*r[1]+dz*r[2];
    const yc = dx*u[0]+dy*u[1]+dz*u[2];
    const s = fs/Math.max(0.05, zc);
    return [w/2 + xc*s + panX, h/2 - yc*s + panY, zc, s];
  };
}

const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const add=(a,b,k)=>[a[0]+b[0]*k, a[1]+b[1]*k, a[2]+b[2]*k];
const norm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];};

function colour(p,mode){
  if(mode==='z'){
    const t=Math.max(0,Math.min(1,(p.z+11.2)/4.6));
    return `hsl(${210-200*t},70%,${45+18*t}%)`;
  }
  if(p.c===1) return '#ffb347';
  if(p.c===2) return '#6fb3ff';
  if(p.c===3) return '#ff5c5c';
  return '#b9c4d0';
}
function seg(V,a,b,col,lw){
  const p=V(a[0],a[1],a[2]), q=V(b[0],b[1],b[2]);
  if(p[2]<=0.15||q[2]<=0.15) return;
  ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(q[0],q[1]);
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.2; ctx.stroke();
}
function quad(V,corners,fill,stroke){
  const q=corners.map(p=>V(p[0],p[1],p[2]));
  if(q.some(p=>p[2]<=0.15)) return;
  ctx.beginPath(); ctx.moveTo(q[0][0],q[0][1]);
  for(let i=1;i<q.length;i++) ctx.lineTo(q[i][0],q[i][1]);
  ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.2;ctx.stroke();}
}
// heading arrow in the horizontal plane
function arrow3(V,p,fwd,col,size){
  const fh=norm([fwd[0],fwd[1],0]);
  const side=[-fh[1],fh[0],0];
  const tip=add(p,fh,size*1.7);
  const b1=add(add(p,side, size*0.75),fh,-size*0.15);
  const b2=add(add(p,side,-size*0.75),fh,-size*0.15);
  const a=V(tip[0],tip[1],tip[2]), b=V(b1[0],b1[1],b1[2]), c=V(b2[0],b2[1],b2[2]);
  if(a[2]<=0.15||b[2]<=0.15||c[2]<=0.15) return;
  ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]);
  ctx.lineTo(c[0],c[1]); ctx.closePath();
  ctx.fillStyle=col; ctx.fill();
}
// a camera frustum: apex at the camera, far rectangle R metres ahead
function frustum(V,cam,R,col){
  const f=cam.f, u=cam.u, r=norm(cross(f,u));
  const tx=Math.tan(D.hfov*Math.PI/360), ty=Math.tan(D.vfov*Math.PI/360);
  const ctr=add(cam.p,f,R);
  const hw=R*tx, hh=R*ty;
  const c=[add(add(ctr,r, hw),u, hh), add(add(ctr,r,-hw),u, hh),
           add(add(ctr,r,-hw),u,-hh), add(add(ctr,r, hw),u,-hh)];
  quad(V,c,'rgba(255,255,255,0.05)',col);
  for(const q of c) seg(V,cam.p,q,col,1.3);
  seg(V,cam.p,ctr,col,1.7);
  const a=V(cam.p[0],cam.p[1],cam.p[2]);
  if(a[2]>0.15){ ctx.beginPath(); ctx.arc(a[0],a[1],3.2,0,7);
    ctx.fillStyle=col; ctx.fill(); }
}

function draw(){
  const w=cv.clientWidth,h=cv.clientHeight;
  ctx.clearRect(0,0,w,h); ctx.fillStyle='#11161c'; ctx.fillRect(0,0,w,h);
  const V=project();
  const mode=document.getElementById('cMode').value;
  const size=+document.getElementById('rSize').value;
  const chk=id=>document.getElementById(id).checked;

  if(chk('cGrid')){
    for(let gx=-14;gx<=14;gx+=2)
      seg(V,[gx,-42,D.floor_z],[gx,38,D.floor_z],'rgba(120,140,165,0.20)',1);
    for(let gy=-42;gy<=38;gy+=2)
      seg(V,[-14,gy,D.floor_z],[14,gy,D.floor_z],'rgba(120,140,165,0.20)',1);
  }
  // boards: the ones visible RIGHT NOW are highlighted, the rest are dimmed
  const visNow = new Set();
  if(S.length && S[sel].vis){
    for(const c of Object.keys(S[sel].vis))
      for(const id of S[sel].vis[c]) visNow.add(id);
  }
  if(chk('cBoards')) D.boards.forEach(b=>{
    const on = visNow.has(b.i);
    quad(V, b.c, on ? 'rgba(80,255,160,0.40)' : 'rgba(120,255,180,0.05)',
              on ? '#eafff3' : 'rgba(79,224,138,0.38)');
  });
  if(chk('cTags'))   D.floor_tags.forEach(b=>quad(V,b.c,'rgba(255,220,120,0.13)','#d9b64a'));

  if(chk('cCyl')){
    const cy=D.cyl,N=20;
    for(const zz of [cy.z0,cy.z1]){
      const ring=[];
      for(let i=0;i<=N;i++){const a=2*Math.PI*i/N;
        ring.push(V(cy.x+cy.r*Math.cos(a),cy.y+cy.r*Math.sin(a),zz));}
      if(ring.every(p=>p[2]>0.15)){
        ctx.beginPath();ctx.moveTo(ring[0][0],ring[0][1]);
        for(let i=1;i<ring.length;i++)ctx.lineTo(ring[i][0],ring[i][1]);
        ctx.strokeStyle='#ff5c5c';ctx.lineWidth=1.5;ctx.stroke();}
    }
    for(let i=0;i<N;i+=4){const a=2*Math.PI*i/N;
      seg(V,[cy.x+cy.r*Math.cos(a),cy.y+cy.r*Math.sin(a),cy.z0],
            [cy.x+cy.r*Math.cos(a),cy.y+cy.r*Math.sin(a),cy.z1],
            'rgba(255,92,92,0.6)',1.1);}
  }

  if(chk('cTraj') && S.length){
    ctx.beginPath(); let st=false;
    for(const s of S){
      const p=V(s.p[0],s.p[1],s.p[2]);
      if(p[2]<=0.15){st=false;continue;}
      if(!st){ctx.moveTo(p[0],p[1]);st=true;} else ctx.lineTo(p[0],p[1]);
    }
    ctx.strokeStyle='#39d98a'; ctx.lineWidth=2.2; ctx.stroke();
  }

  // only ONE arrow, at the selected instant (drawn with the frustums below)

  if(chk('cPts')){
    const buf=[];
    for(const p of pts){
      const s=V(p.x,p.y,p.z);
      if(s[2]<=0.15) continue;
      buf.push([s[2],s[0],s[1],p]);
    }
    buf.sort((a,b)=>b[0]-a[0]);
    for(const [z,x,y,p] of buf){
      const r=Math.max(0.6, size*20/z);
      ctx.fillStyle=colour(p,mode);
      ctx.fillRect(x-r/2,y-r/2,r,r);
    }
  }

  if(chk('cFru') && S.length){
    const s=S[sel], R=+fr.value;
    for(const c of s.cams) frustum(V,c,R,CAMCOL[c.n]);
    // the single heading arrow for THIS instant
    arrow3(V, s.p, s.f, '#8affc0', 0.55);
    // label the boards being tracked right now
    D.boards.forEach(b=>{
      if(!visNow.has(b.i)) return;
      const p=V(b.c[0][0], b.c[0][1], b.c[0][2]);
      if(p[2]>0.15){
        ctx.fillStyle='#eafff3'; ctx.font='bold 11px system-ui';
        ctx.fillText('board '+b.i+'  ●visible', p[0]+4, p[1]-4);
      }
    });
    const a=V(s.p[0],s.p[1],s.p[2]);
    if(a[2]>0.15){
      ctx.beginPath(); ctx.arc(a[0],a[1],6.5,0,7);
      ctx.fillStyle='#ffffff'; ctx.fill();
      ctx.strokeStyle='#11161c'; ctx.lineWidth=2.2; ctx.stroke();
    }
    ctx.font='11px system-ui';
    for(const c of s.cams){
      const p=V(c.p[0],c.p[1],c.p[2]);
      if(p[2]>0.15){ ctx.fillStyle=CAMCOL[c.n]; ctx.fillText(c.n,p[0]+7,p[1]-6); }
    }
  }

  if(chk('cSpin')) az+=0.004;
  if(playing && S.length){
    sel=(sel+1)%S.length; tl.value=sel; fmt(sel);
  }
  requestAnimationFrame(draw);
}
fmt(0);
draw();
</script>
